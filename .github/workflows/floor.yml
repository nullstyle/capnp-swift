# The platform floor (plan D2: macOS 15, iOS 18), run on demand (M9 G5).
# CI and the nightly use only macOS 26 runners and their newest iOS
# simulator, so nothing else runs the floor. Manual until it has passed;
# then it can join the nightly.
#
# There is no macOS 15 job: the newest Xcode on GitHub's macos-15 image is
# 26.3 (Swift 6.2.4), and the package needs Swift 6.3 (WasmKit 0.4.1, the
# codegen plugin's dependency, declares tools version 6.3), so it cannot
# even resolve there (floor run 39203967306). The macOS 15 runtime stays
# untested.
name: floor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios18-simulator:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Checkout
        run: |
          if [ ! -d .git ]; then
            git init -q .
            git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
            git fetch --quiet --depth=1 origin "${GITHUB_SHA}"
            git checkout -q FETCH_HEAD
          fi
      - name: mise
        run: |
          export PATH="/opt/homebrew/bin:$PATH:$HOME/.local/bin"
          if ! command -v mise >/dev/null 2>&1; then
            curl -fsSL https://mise.run | sh
          fi
          mise install
          mise exec -- zig version
      - name: The test suite on an iOS 18 simulator
        run: |
          export PATH="/opt/homebrew/bin:$PATH:$HOME/.local/bin"
          set -euxo pipefail
          cd core && mise exec -- zig build xcframework -Dios=true && cd ..
          scripts/use-local-core.sh
          pick() {
            xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rs = [r for r in json.load(sys.stdin)["runtimes"]
                if r.get("platform") == "iOS" and r["version"].startswith("18.") and r.get("isAvailable")]
          rs.sort(key=lambda r: [int(x) for x in r["version"].split(".")])
          print(rs[-1]["identifier"] if rs else "")'
          }
          RUNTIME="$(pick)"
          if [ -z "$RUNTIME" ]; then
            # Not on the image: fetch the newest iOS 18 simulator runtime.
            xcodebuild -downloadPlatform iOS -buildVersion 18.6
            RUNTIME="$(pick)"
          fi
          [ -n "$RUNTIME" ] || { echo "no iOS 18 simulator runtime" >&2; exit 1; }
          echo "runtime $RUNTIME"
          UDID="$(xcrun simctl create floor-ios18 com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$RUNTIME")"
          D=(-scheme capnp-swift-Package -destination "platform=iOS Simulator,id=$UDID")
          xcodebuild build-for-testing "${D[@]}"
          # The nightly's split (nightly.yml ios-sim): one process per
          # workload. In one process the 64 x 10k stress test starved the
          # TCP/TLS tests past their deadlines (floor run 39203967306).
          # QUIC tests are macOS/iOS 26+ (@available) and skip on 18; their
          # selection must still pass.
          selection() { # selection <log> <xcodebuild selection args...>
            local log=$1; shift
            xcodebuild test-without-building "${D[@]}" "$@" 2>&1 | tee "$log"
            grep -E 'Test run with [0-9]+ tests? in [0-9]+ suites? passed' "$log"
          }
          selection network.log '-only-testing:CapnpRPCTests/TCPTests' '-only-testing:CapnpRPCTests/M5Tests' \
            '-only-testing:CapnpRPCTests/ExecutorProbeTests'
          selection quic.log '-only-testing:CapnpRPCTests/QUICTests' '-only-testing:CapnpRPCTests/QUICOrderTests'
          selection runtime.log '-only-testing:CapnpRPCTests' '-skip-testing:CapnpRPCTests/TCPTests' \
            '-skip-testing:CapnpRPCTests/M5Tests' '-skip-testing:CapnpRPCTests/QUICTests' \
            '-skip-testing:CapnpRPCTests/QUICOrderTests' '-skip-testing:CapnpRPCTests/ExecutorProbeTests' \
            '-skip-testing:CapnpRPCTests/LoopbackTests/manyConnections()'
          selection conformance.log '-only-testing:CapnpConformanceTests'
          selection stress.log '-only-testing:CapnpRPCTests/LoopbackTests/manyConnections()'
